name: Security Pipeline - MediConnect
on:
  push:
    branches: [ main, test/fix-security-pipeline ]
  pull_request:
    branches: [ main ]
jobs:
  secrets-scan:
    name: Gitleaks - Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Gitleaks CLI
        run: |
          curl -sSfL --proto "=https" https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Run Gitleaks
        run: ./gitleaks detect --source . --verbose --redact
  sast-scan:
    name: Semgrep - SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Semgrep SAST Scan
        run: semgrep scan --config "p/php" --config "p/owasp-top-ten" --error
  sca-scan:
    name: Composer Audit - SCA Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Security audit (CVE scan only)
        run: composer audit --locked --no-dev --abandoned=report