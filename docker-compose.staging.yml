# docker-compose.staging.yml — Environnement de staging isolé
# NE JAMAIS partager les volumes avec la production.
# Utilisé exclusivement par le pipeline Jenkins CD (stage staging).

networks:
  staging_net:
    driver: bridge

volumes:
  db_data_staging:

services:

  # -----------------------------------------------------------------------
  # Application Symfony — Staging
  # Utilise l'image publiée sur GHCR.
  # Port 8001 pour éviter tout conflit avec la prod (port 80/443).
  # -----------------------------------------------------------------------
  app-staging:
    image: ${GHCR_IMAGE}:${GIT_COMMIT}
    ports:
      - "8001:80"
    volumes:
      - ./var/uploads-staging:/var/www/html/var/uploads
    environment:
      - APP_ENV=prod
      - APP_SECRET=${STAGING_APP_SECRET}
      - APP_DB_PASSWORD=${STAGING_DB_PASSWORD}
      - DATABASE_URL=mysql://mediconnect_app:${STAGING_DB_PASSWORD}@database:3306/mediconnect?serverVersion=10.4.32-MariaDB&charset=utf8mb4
      - MESSENGER_TRANSPORT_DSN=doctrine://default?auto_setup=0
    depends_on:
      database-staging:
        condition: service_healthy
    networks:
      - staging_net
    restart: "no"

  # -----------------------------------------------------------------------
  # Base de données — Staging (MariaDB 10.4 isolée)
  # Base `mediconnect` — volume `db_data_staging` dédié.
  # Alias réseau `database` pour que app s'y connecte de façon transparente.
  # -----------------------------------------------------------------------
  database-staging:
    image: mariadb:10.4
    environment:
      - MYSQL_ROOT_PASSWORD=${STAGING_DB_PASSWORD}
      - MYSQL_DATABASE=mediconnect
      - MYSQL_USER=mediconnect_app
      - MYSQL_PASSWORD=${STAGING_DB_PASSWORD}
      - APP_DB_PASSWORD=${STAGING_DB_PASSWORD}
    volumes:
      - db_data_staging:/var/lib/mysql
      - ./docker/init-mediconnect-user.sh:/docker-entrypoint-initdb.d/init-mediconnect-user.sh
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${STAGING_DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      staging_net:
        aliases:
          - database
    restart: "no"
