security:
    enable_authenticator_manager: true
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginAuthenticator
            logout:
                path: app_logout
            # ✅ SÉCURITÉ : Anti-brute force — max 5 tentatives par minute par IP
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/patient, roles: ROLE_PATIENT }
        - { path: ^/medecin, roles: ROLE_MEDECIN }
        # ✅ SÉCURITÉ : API disponibilités accessible uniquement aux patients authentifiés
        - { path: ^/api, roles: ROLE_PATIENT }