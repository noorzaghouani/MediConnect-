server {
    listen 80;
    server_name mediconnect.com;

    # Redirection permanente vers HTTPS (utilise $server_name pour eviter toute injection de Host header)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name mediconnect.com;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Taille max pour l'upload des diplômes (5MB côté Symfony, 20MB de marge côté Nginx)
    client_max_body_size 20M;

    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Timeouts pour requêtes longues
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
